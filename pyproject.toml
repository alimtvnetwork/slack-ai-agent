[project]
name = "slack-agent"
version = "0.1.0"
description = "Enterprise Slack AI assistant with file analysis, web search, and human-in-the-loop write approvals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=6.2.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.20",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.2",
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.31.0",
]

[project.scripts]
slack-agent = "slack_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "guidelines",
    "agent_rules",
    "spec",
    ".venv",
    "dist",
    "build",
]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PLR",    # Pylint refactor
    "PLC",    # Pylint convention
    "PLE",    # Pylint error
    "FA",     # flake8-future-annotations
]
ignore = [
    "S104",   # Possible binding to all interfaces
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "slack_bolt.*",
    "slack_sdk.*",
    "reportlab.*",
    "docx.*",
    "pypdf.*",
    "ddgs.*",
    "bs4.*",
    "openpyxl.*",
    "matplotlib.*",
    "aiosqlite.*",
]
ignore_missing_imports = true





[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
